<style>
/* Layout: nautical-chart archive — map hero, index of claims, each claim a "chart entry" with clip, verdict and discussion */
:root{
  --paper:#e8eef0; --card:#f7fafa; --ink:#13263f; --ink-2:#4a5d73; --rule:#c7d3d9;
  --sea:#cddde4; --land:#efe7d3; --land-ink:#7a6a45; --gold:#a8791f; --gold-soft:#f3e7cb;
  --salah:#b3261e; --salah-bg:#f9e2df; --tak:#9a5700; --tak-bg:#fbeed6; --belum:#4f5b68; --belum-bg:#e3e8ec;
  --seb:#0d6a70; --seb-bg:#d9eeee; --betul:#2b7a31; --betul-bg:#def0df;
  --f-old:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-oldi:"IM Fell English",Georgia,serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1823; --card:#152230; --ink:#e3e9ef; --ink-2:#9fb0c2; --rule:#26384b;
  --sea:#14283a; --land:#2a2a22; --land-ink:#b8a77c; --gold:#d9ad55; --gold-soft:#33291a;
  --salah:#ff8a80; --salah-bg:#3a1d1c; --tak:#f2b35e; --tak-bg:#382915; --belum:#b6c1cc; --belum-bg:#223040;
  --seb:#6fd0d5; --seb-bg:#123234; --betul:#8fd694; --betul-bg:#1b331f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1823; --card:#152230; --ink:#e3e9ef; --ink-2:#9fb0c2; --rule:#26384b;
  --sea:#14283a; --land:#2a2a22; --land-ink:#b8a77c; --gold:#d9ad55; --gold-soft:#33291a;
  --salah:#ff8a80; --salah-bg:#3a1d1c; --tak:#f2b35e; --tak-bg:#382915; --belum:#b6c1cc; --belum-bg:#223040;
  --seb:#6fd0d5; --seb-bg:#123234; --betul:#8fd694; --betul-bg:#1b331f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body)}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font:22px/1 var(--f-old);text-decoration:none;letter-spacing:.02em;display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.nav nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav nav a{text-decoration:none;font-size:14.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:6px}
.nav nav a[aria-current="page"]{color:var(--ink);background:var(--gold-soft)}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 9px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* sanggahan: kad penyanggah */
.ppl{display:grid;gap:10px;margin:0 0 8px}
.pp{background:var(--card);border:1px solid var(--rule);border-radius:10px;min-width:0;scroll-margin-top:130px}
.pp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.pp>summary::-webkit-details-marker{display:none}
.pp>summary:hover{background:color-mix(in srgb,var(--gold-soft) 45%,transparent);border-radius:10px}
.pp[open]>summary{border-bottom:1px solid var(--rule);border-radius:10px 10px 0 0}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--ink);color:var(--paper);display:grid;place-items:center;font:22px/1 var(--f-old);flex:none}
.av.sm{width:26px;height:26px;font-size:11px;border-width:1.5px}
.pp-n{font:600 17px/1.25 var(--f-body);margin:0}
.pp-j{font-size:13.5px;color:var(--ink-2);margin:2px 0 0}
.pp-c{font:500 12px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap;text-align:right}
.pp-c b{display:block;font:22px/1 var(--f-old);color:var(--gold);margin-bottom:3px}
.pp-c .chev{display:inline-block;transition:transform .15s}
.pp[open] .pp-c .chev{transform:rotate(180deg)}
.pp-body{padding:12px 16px 16px}
.pp-cred{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--betul);background:color-mix(in srgb,var(--betul-bg) 55%,transparent);border-radius:0 6px 6px 0}
.pp-cred dt{color:var(--ink-2);font:600 11px/1.9 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.pp-cred dd{margin:0;min-width:0}
.pp-cred a{overflow-wrap:anywhere}
.sg-h{font:20px/1.25 var(--f-old);margin:26px 0 10px}
.jn{font:600 10.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:4px;white-space:nowrap}
.jn-sanggahan{color:var(--salah);background:var(--salah-bg)} .jn-bacaan{color:var(--seb);background:var(--seb-bg)} .jn-jemputan{color:var(--tak);background:var(--tak-bg)}
.callout{border:1px solid var(--tak);background:var(--tak-bg);border-radius:10px;padding:14px 16px;margin:16px 0 4px}
.callout h3{font:18px/1.2 var(--f-old);margin:0 0 6px}
.txbox{margin-top:10px;max-height:420px;overflow:auto;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-size:14.5px;line-height:1.65}
.txbox p{margin:0 0 8px;overflow-wrap:anywhere}
.txbox a{font:500 12px var(--f-mono);color:var(--gold);margin-right:6px}
.who{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600}
@media (max-width:560px){.pp>summary{grid-template-columns:48px 1fr;}.pp-c{grid-column:2;text-align:left}.pp-c b{display:inline;margin-right:4px;font-size:16px}.av{width:48px;height:48px;font-size:17px}.pp-cred{grid-template-columns:1fr}}
.art{border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:8px;margin:0 0 12px;background:var(--paper)}
.art>summary{cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:10px 12px;list-style:none}
.art>summary::-webkit-details-marker{display:none}
.art-t{font:600 16px/1.35 var(--f-body)}
.art-b{padding:0 14px;max-height:70vh;overflow:auto;font-size:15px;line-height:1.7}
.art-b p{margin:0 0 10px;overflow-wrap:anywhere}
.art .vnote{padding:0 14px 10px}
.art-img{display:block;max-width:100%;margin:6px 0 12px;border:1px solid var(--rule);border-radius:6px}
.sg-img{display:block;max-width:min(100%,420px);margin-top:6px;border:1px solid var(--rule);border-radius:6px}
.orig{margin:-8px 0 16px;font-size:14px;color:var(--ink-2);max-width:68ch}
.orig b{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}

/* hero */
.hero{position:relative;border-bottom:1px solid var(--rule);overflow:hidden;background:var(--sea)}
.hero svg.map{display:block;width:100%;height:clamp(240px,38vw,420px)}
.hero-map{position:relative}
.speaker{position:absolute;right:max(3%,env(safe-area-inset-right,0px));bottom:12px;width:clamp(120px,19vw,240px);margin:0}
.speaker img{display:block;width:100%;height:auto;aspect-ratio:8/9;object-fit:cover;border-radius:50%/46%;border:4px solid var(--gold);box-shadow:0 0 0 3px #13263f,6px 6px 0 rgba(19,38,63,.35)}
.speaker figcaption{margin-top:6px;font:10.5px/1.25 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:3px 6px;border-radius:4px;text-align:center}
.bubble{position:absolute;right:calc(max(3%,env(safe-area-inset-right,0px)) + clamp(100px,16vw,200px));bottom:clamp(120px,18vw,250px);max-width:min(440px,60vw);
  background:var(--card);color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);border-radius:20px;padding:12px 16px 10px;box-shadow:4px 4px 0 var(--ink);transform-origin:90% 100%}
.bubble::after{content:"";position:absolute;right:26px;bottom:-18px;width:26px;height:20px;background:var(--card);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:skewX(-35deg) rotate(8deg);border-bottom-right-radius:6px}
.bq{display:block;font:italic clamp(15px,1.9vw,22px)/1.3 var(--f-oldi);min-height:2.6em}
.bq::before{content:"“"} .bq::after{content:"”"}
.bc{display:block;margin-top:6px;font:12px/1.3 var(--f-mono);color:var(--ink-2)}
.bubble:hover{box-shadow:6px 6px 0 var(--gold)}
@media (prefers-reduced-motion:no-preference){.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:560px){.bubble{bottom:118px;right:82px;max-width:calc(100% - 110px);padding:9px 12px 8px;border-radius:14px}.bq{font-size:15px;min-height:3.9em}.speaker figcaption{display:none}}
.hero-txt{position:relative;padding-block:26px 30px;background:var(--paper);border-top:1px solid var(--rule)}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font:clamp(38px,7vw,74px)/.95 var(--f-old);margin:10px 0 12px;text-wrap:balance;letter-spacing:.01em}
.lede{max-width:60ch;margin:0;color:var(--ink-2);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px}
.stats div{font-size:13px;color:var(--ink-2)}
.stats b{display:block;font:28px/1.05 var(--f-old);color:var(--ink);font-variant-numeric:tabular-nums}

/* filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:18px 8px}
.tools input[type=search]{flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.tools select{padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);max-width:100%}
.tog{display:flex;gap:6px;align-items:center;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);cursor:pointer;white-space:nowrap}
.filters{padding-top:0;gap:8px 10px}
.fl{display:flex;flex-direction:column;gap:3px;font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);min-width:0}
.fl select{text-transform:none;letter-spacing:0;font:400 14.5px var(--f-body);color:var(--ink)}
.filters .tog{align-self:flex-end}
.reset{align-self:flex-end;border:0;background:none;color:var(--gold);font-weight:600;font-size:14px;padding:9px 6px;cursor:pointer;text-decoration:underline}
@media (max-width:560px){.filters .fl{flex:1 1 calc(50% - 10px)}.fl select{width:100%}}
.count{font:13px var(--f-mono);color:var(--ink-2);margin:6px 0 14px}

/* index */
.src-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.grp>summary{list-style:none;cursor:pointer}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover h2{color:var(--gold)}
.grp .chev{display:inline-block;transition:transform .15s}
.grp[open] .chev{transform:rotate(180deg)}
.grp>.rows{margin-bottom:6px}
.src-h h2{font:20px/1.25 var(--f-old);margin:0;flex:1 1 300px;min-width:0;text-wrap:balance}
.src-h .meta{font:12.5px var(--f-mono);color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--card);border:1px solid var(--rule);border-radius:8px;text-decoration:none}
.row:hover{border-color:var(--gold)}
.row .id{font:12px/1.7 var(--f-mono);color:var(--ink-2)}
.row .t{min-width:0}
.row .t p{margin:0}
.row .sub{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.row .r{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.clipmark{font:500 11px/1 var(--f-mono);color:var(--gold)}
.fatalno{font:500 11px/1 var(--f-mono);color:var(--salah)}
@media (max-width:600px){.row{grid-template-columns:1fr}.row .r{flex-direction:row;align-items:center}}
mark{background:var(--gold-soft);color:inherit;border-radius:2px}

/* pills */
.v{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:4px;white-space:nowrap}
.v-salah{color:var(--salah);background:var(--salah-bg)} .v-tak{color:var(--tak);background:var(--tak-bg)}
.v-belum{color:var(--belum);background:var(--belum-bg)} .v-seb{color:var(--seb);background:var(--seb-bg)}
.v-betul{color:var(--betul);background:var(--betul-bg)} .v-none{color:var(--ink-2);background:transparent;border:1px dashed var(--rule)}
.new{font:600 10.5px/1 var(--f-mono);color:var(--gold);border:1px solid var(--gold);padding:3px 5px;border-radius:4px;letter-spacing:.06em}

/* detail */
.crumb{font:13px var(--f-mono);color:var(--ink-2);padding-block:22px 6px}
.crumb a{color:var(--ink-2)}
.claim-q{font:clamp(24px,3.6vw,36px)/1.25 var(--f-oldi);margin:6px 0 16px;max-width:30em;text-wrap:balance}
.claim-q::before{content:"“";color:var(--gold)} .claim-q::after{content:"”";color:var(--gold)}
.verdict-box{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:18px}
.verdict-box p{margin:0;color:var(--ink-2);max-width:68ch;flex:1 1 300px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{font:18px/1.2 var(--f-old);margin:0 0 10px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vnote{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.fbvideo{position:relative;width:min(100%,360px);aspect-ratio:9/16;margin:0 auto;background:#000;border-radius:8px;overflow:hidden}
.fbvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sang{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sang li{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--rule);min-width:0}
.sang li:last-child{border-bottom:0;padding-bottom:0}
.sang a{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.sang .m{font-size:12.5px;color:var(--ink-2)}
.sang .fbbtn{padding:6px 12px;font-size:13px;margin-top:4px}
.fbslot{margin-top:8px;max-width:100%;overflow:hidden}
.tts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;min-width:0}
.tt-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tt-d{font:20px/1 var(--f-old);color:var(--gold)}
.tt .m{font:12.5px var(--f-mono);color:var(--ink-2)}
.tt-ti{margin:6px 0 4px;overflow-wrap:anywhere}
.tt-snip{margin:4px 0 6px;font-size:14px;color:var(--ink-2);border-left:3px solid var(--gold);padding-left:10px;overflow-wrap:anywhere}
.tt .btns{align-items:center}.tt .btns a{font-size:13.5px}
.tt .btn.alt{padding:6px 12px;font-size:13.5px}
.tt-slot{margin-top:10px}
.ttvideo{position:relative;width:min(100%,325px);aspect-ratio:325/578;background:#000;border-radius:8px;overflow:hidden}
.ttvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tt-tx{margin-top:10px;max-height:340px;overflow:auto;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-size:14.5px;line-height:1.65}
.tt-tx p{margin:0 0 6px;overflow-wrap:anywhere}
.links{display:flex;flex-direction:column;gap:6px}
.links a{color:var(--ink);font-size:14.5px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--rule)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.dl dt{color:var(--ink-2)} .dl dd{margin:0;min-width:0}
.sib{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:14px}
.sib a{text-decoration:none;display:block;padding:6px 8px;border-radius:6px}
.sib a:hover{background:var(--gold-soft)} .sib a[aria-current]{background:var(--gold-soft);font-weight:600}
.pemb{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.pemb .by{font-size:12.5px;color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:14.5px}
section.sec{margin-top:22px}

/* prose pages */
.prose{max-width:70ch;padding-block:10px 40px}
.prose h2{font:26px/1.2 var(--f-old);margin:28px 0 8px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--gold)}
.tl li{position:relative;padding:4px 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.tl b{font:500 13px var(--f-mono);display:block}
.ruj{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:-6px 0 20px;padding:10px 14px;border:1px solid var(--rule);border-left:3px solid var(--betul);border-radius:6px;background:var(--card);font-size:14px}
.ruj-h{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--betul);flex-basis:100%}
.ruj a{color:var(--ink);overflow-wrap:anywhere}
.rj{font:600 10px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;border-radius:3px;color:var(--ink-2);background:var(--belum-bg)}
.rj-jurnal,.rj-buku{color:var(--betul);background:var(--betul-bg)} .rj-rasmi{color:var(--seb);background:var(--seb-bg)}
/* penerbitan + pembaca PDF */
.pubs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pub{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:8px}
.pub .yr{font:22px/1 var(--f-old);color:var(--gold);font-variant-numeric:tabular-nums}
.pub h3{font:600 16.5px/1.35 var(--f-body);margin:0 0 4px;min-width:0;overflow-wrap:anywhere}
.pub .m{font-size:13.5px;color:var(--ink-2)}
.pub .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pub .acts a{font-size:13px}
.chip{font:500 12px/1 var(--f-mono);padding:5px 7px;border:1px solid var(--rule);border-radius:4px;text-decoration:none;color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.acc{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-radius:4px}
.acc-ok{color:var(--betul);background:var(--betul-bg)} .acc-no{color:var(--ink-2);background:var(--belum-bg)}
@media (max-width:560px){.pub{grid-template-columns:1fr;gap:4px}}
.pdfbox{position:relative;height:min(82vh,1000px);border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--belum-bg)}
.pdfbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
footer{border-top:1px solid var(--rule);margin-top:40px;padding-block:22px calc(28px + env(safe-area-inset-bottom,0px));font-size:13.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.row,.sib a{transition:border-color .15s,background .15s}}
</style>

<script>
(function(){
const A = window.ARKIB, C = window.ARKIB_CONFIG || {};
const ART = window.ARKIB_MODE === "artifact"; // versi claude.ai: tiada iframe luar, komen melalui claude.ai
// ---- Dwibahasa: BM bahasa utama; EN pilihan pembaca (diingat dalam pelayar, atau ?lang=en) ----
let LANG = "ms";
try { if (localStorage.getItem("arkib-lang") === "en") LANG = "en"; } catch {}
const qLang = new URLSearchParams(location.search).get("lang");
if (qLang === "en" || qLang === "ms") LANG = qLang;
const EN = () => LANG === "en";
const L = (ms, en) => EN() ? en : ms;
const VL = {"Salah":"False","Tak disokong":"Unsupported","Belum dapat disahkan":"Unverified","Sebahagian betul":"Partly true","Betul":"True"};
const BLN = {Mac:"Mar", Mei:"May", Ogos:"Aug", Okt:"Oct", Dis:"Dec"};
const tgl = s => EN() ? String(s ?? "").replace(/\b(Mac|Mei|Ogos|Okt|Dis)\b/g, m => BLN[m]).replace(/Tarikh tak pasti/, "Date uncertain") : s;
const tD = d => EN() && d.en ? d.en.t : d.t;                       // teks dakwaan
const nD = d => EN() && d.en && d.en.n ? d.en.n : d.n;             // nota semakan
const sF = (s, k) => EN() && s.en && s.en[k] ? s.en[k] : (k === "tarikh" ? tgl(s[k]) : s[k]); // tajuk/platform/tarikh/nota sumber
const vL = v => EN() ? (VL[v] || v) : v;
const tema = () => EN() && A.tema_en ? A.tema_en : A.tema;
const VC = {"Salah":"v-salah","Tak disokong":"v-tak","Belum dapat disahkan":"v-belum","Sebahagian betul":"v-seb","Betul":"v-betul"};
const all = [];
A.sumber.forEach(s => s.d.forEach(d => all.push({s, d, isNew: !!(s.baru || d.baru)})));
const byId = Object.fromEntries(all.map(c => [c.d.id, c]));
const st = {q:"", tema:"", v:"", fatal:false, klip:false, susun:"baru", tahun:""};
const tahunOf = s => (s.tarikh.match(/20\d\d/) || ["?"])[0];
const TAHUN = [...new Set(A.sumber.map(tahunOf))].filter(y => y !== "?").sort().reverse();
const app = document.getElementById("app");
function chrome(){
  document.documentElement.lang = LANG;
  const N = {home: L("Dakwaan","Claims"), fatal: L("50 Paling Fatal","50 Most Fatal"), sanggahan: L("Sanggahan","Rebuttals"), tiktok: "TikTok",
    penerbitan: L("Penerbitan","Publications"), kronologi: L("Kronologi","Timeline"), tentang: L("Tentang","About")};
  document.querySelectorAll(".nav nav a").forEach(a => a.textContent = N[a.dataset.r]);
  document.querySelector(".nav nav").setAttribute("aria-label", L("Utama","Main"));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.getElementById("foot").innerHTML = L(
    `Arkib ini mengumpul kenyataan awam Solehah Yaacob dan semakan fakta terhadapnya, dengan link kepada sumber asal. Klip dimainkan daripada YouTube, Facebook dan TikTok; hak cipta video kekal milik pemilik saluran. <a href="#tentang">Kaedah &amp; hak menjawab</a>. Dikemas kini ${esc(A.dikemas_kini)}.`,
    `This archive collects Solehah Yaacob's public statements and fact-checks of them, with links to the original sources. Clips play from YouTube, Facebook and TikTok; video copyright remains with the channel owners. The archive's primary language is Malay; English translations are provided by the archive. <a href="#tentang">Method &amp; right of reply</a>. Updated ${esc(tgl(A.dikemas_kini))}.`);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("arkib-lang", LANG); } catch {}
  if (qLang) history.replaceState(null, "", location.pathname + location.hash);
  chrome(); route();
}));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl = s => { const t = esc(s); if (!st.q) return t; const q = esc(st.q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return t.replace(new RegExp("(" + q + ")", "gi"), "<mark>$1</mark>"); };
const fmt = sec => { sec = Math.max(0, sec|0); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const pill = v => v ? `<span class="v ${VC[v]}">${esc(vL(v))}</span>` : `<span class="v v-none">${L("Belum disemak","Not yet checked")}</span>`;
const hasClip = c => !!(c.s.yt || c.s.fb || c.s.tt);
const siteUrl = () => (C.siteUrl || location.href.split("#")[0].split("?")[0]);
// Link kongsi: halaman d/<ID>/ ada pratonton kad untuk Threads/WhatsApp (versi claude.ai guna #hash)
const claimUrl = id => ART ? siteUrl() + L("", "?lang=en") + "#d-" + id : siteUrl() + "d/" + id + "/" + L("", "?lang=en");

function rowHTML(c){
  const sub = [`<span>${esc(sF(c.s, "tarikh"))}</span>`];
  if (hasClip(c)) sub.push(`<span class="clipmark">▶ ${L("klip","clip")}${c.d.ts != null ? " " + fmt(c.d.ts) : ""}</span>`);
  if (c.d.fatal) sub.push(`<span class="fatalno">FATAL #${c.d.fatal}</span>`);
  if (c.isNew) sub.push(`<span class="new">${L("BARU","NEW")}</span>`);
  return `<li><a class="row" href="#d-${c.d.id}"><span class="id">${c.d.id}</span><span class="t"><p>${hl(tD(c.d))}</p><span class="sub">${sub.join("")}</span></span><span class="r">${pill(c.d.v)}</span></a></li>`;
}
function match(c){
  if (st.fatal && !c.d.fatal) return false;
  if (st.klip && !hasClip(c)) return false;
  if (st.tahun && tahunOf(c.s) !== st.tahun) return false;
  if (st.tema && !c.d.g.split(",").includes(st.tema)) return false;
  if (st.v){ if (st.v === "-" ? !!c.d.v : c.d.v !== st.v) return false; }
  if (st.q){ const e = c.d.en || {}, se = c.s.en || {};
    const h = [c.d.t, c.d.n, c.s.tajuk, c.d.id, e.t, e.n, se.tajuk].filter(Boolean).join(" ").toLowerCase();
    if (!h.includes(st.q.toLowerCase())) return false; }
  return true;
}

// Gelembung dialog: ayat SEBENAR beliau (verbatim), setiap satu dipautkan ke klip & bukti
const PETIKAN = [
  {q: "Orang Rom belajar daripada orang Melayu macam mana cara hendak membuat kapal.", en: "The Romans learned from the Malays how to build ships.", id: "S01-23", bila: "ceramah, 31 Dis 2022", bilaEn: "lecture, 31 Dec 2022"},
  {q: "Jadi sebenarnya dalam Melayu terbang itu semua, itu ada dalam kitab.", en: "So actually, all that about the flying Malays, it's in the books.", id: "S11-23", bila: "podcast Harakah, 2026", bilaEn: "Harakah podcast, 2026"},
  {q: "Hang Tuah itu wujud dan pernah sampai ke Vatican City!", en: "Hang Tuah existed and once reached Vatican City!", id: "S13-03", bila: "tajuk video saluran beliau, 8 Okt 2026", bilaEn: "video title on her channel, 8 Oct 2026"},
  {q: "Saya kata eh memang besi daripada langit.", en: "I said, yes, the iron really came from the sky.", id: "S11-22", bila: "podcast Harakah, 2026", bilaEn: "Harakah podcast, 2026"},
  {q: "Ptolemy sebut pasal Hang Tuah.", en: "Ptolemy mentions Hang Tuah.", id: "S11-52", bila: "podcast Harakah, 2026", bilaEn: "Harakah podcast, 2026"},
  {q: "25,000 tahun Gunung Padang ada piramid.", en: "Gunung Padang has had a pyramid for 25,000 years.", id: "S11-18", bila: "podcast Harakah, 2026", bilaEn: "Harakah podcast, 2026"},
];
let bubbleTimer = null;
const pq = p => EN() ? p.en : p.q;
const pcap = p => EN() ? `— Solehah Yaacob, ${esc(p.bilaEn)} · translated from Malay · <u>watch &amp; check</u>` : `— Solehah Yaacob, ${esc(p.bila)} · <u>tonton &amp; semak</u>`;
function speakerHTML(){
  return `<figure class="speaker"><img src="solehah.jpg" width="480" height="540" alt="${L("Solehah Yaacob semasa berceramah (tangkap layar video saluran rasmi beliau)","Solehah Yaacob speaking (screenshot from her official channel's video)")}">
    <figcaption>${L("Solehah Yaacob · video saluran beliau, 8 Okt 2026","Solehah Yaacob · video on her channel, 8 Oct 2026")}</figcaption></figure>
  <a class="bubble" id="bubble" href="#d-${PETIKAN[0].id}"><span class="bq" id="bq">${esc(pq(PETIKAN[0]))}</span><span class="bc" id="bc">${pcap(PETIKAN[0])}</span></a>`;
}
function startBubbles(){
  clearInterval(bubbleTimer);
  const b = document.getElementById("bubble"); if (!b) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0, ch = pq(PETIKAN[0]).length, wait = 0, paused = false;
  b.addEventListener("mouseenter", () => paused = true); b.addEventListener("mouseleave", () => paused = false);
  b.addEventListener("focus", () => paused = true); b.addEventListener("blur", () => paused = false);
  const show = k => { const p = PETIKAN[k]; b.href = "#d-" + p.id; document.getElementById("bc").innerHTML = pcap(p); };
  bubbleTimer = setInterval(() => {
    if (!document.body.contains(b)) { clearInterval(bubbleTimer); return; }
    if (paused) return;
    const q = pq(PETIKAN[i]);
    if (still) { if (++wait > 70) { wait = 0; i = (i + 1) % PETIKAN.length; show(i); document.getElementById("bq").textContent = pq(PETIKAN[i]); } return; }
    if (ch < q.length) { ch += 1; document.getElementById("bq").textContent = q.slice(0, ch); }
    else if (++wait > 60) { wait = 0; ch = 0; i = (i + 1) % PETIKAN.length; show(i); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  }, 45);
}
function heroHTML(){
  const n = all.length, sal = all.filter(c => c.d.v === "Salah").length, klip = all.filter(hasClip).length;
  let map = document.getElementById("map-tpl").innerHTML;
  if (EN()) map = map.replace("Peta lama gaya Ptolemy: Aurea Chersonesus (Semenanjung Emas)", "Ptolemy-style old map: Aurea Chersonesus (the Golden Chersonese)")
    .replace("TABVLA DAKWAAN", "TABVLA CLAIMS").replace("mengikut gaya Ptolemy", "after the manner of Ptolemy");
  return `<section class="hero"><div class="hero-map">${map}${speakerHTML()}</div>
  <div class="hero-txt"><div class="wrap">
    <div class="eyebrow">${L("Arkib terbuka","Open archive")} · 2018–2026</div>
    <h1>${L("Arkib Dakwaan Solehah","The Solehah Claims Archive")}</h1>
    <p class="lede">${L("Setiap dakwaan sejarah Solehah Yaacob, diikat pada klip atau hantaran asalnya, dengan status semakan fakta. Baca, tonton sendiri, komen, dan hantar pembahasan.",
      "Every historical claim made by Solehah Yaacob, tied to its original clip or post, with a fact-check status. Read, watch for yourself, comment, and submit a rebuttal. Claims are translated from Malay; the original wording is shown on each claim page.")}</p>
    <div class="stats"><div><b>${n}</b>${L("dakwaan","claims")}</div><div><b>${A.sumber.length}</b>${L("sumber","sources")}</div><div><b>${klip}</b>${L("ada klip","with clips")}</div><div><b>${sal}</b>${L("ditanda salah","marked false")}</div></div>
  </div></div></section>`;
}
function toolsHTML(){
  const opt = (v, l, cur) => `<option value="${v}"${cur===v?" selected":""}>${esc(l)}</option>`;
  const susun = (st.fatal ? [["nombor", L("Ikut nombor 1–50","By number 1–50")]] : []).concat([["baru", L("Terbaru dahulu","Newest first")],["lama", L("Terlama dahulu","Oldest first")],["popular", L("Paling banyak diperkatakan","Most discussed")],["sanggah", L("Paling banyak sanggahan","Most rebutted")]]);
  const all_ = L("Semua","All");
  return `<div class="tools">
    <input type="search" id="q" placeholder="${L("Cari: Keturah, Kalah, Hang Tuah, meteor…","Search: Keturah, Kalah, Hang Tuah, meteor…")}" aria-label="${L("Cari dakwaan","Search claims")}" value="${esc(st.q)}">
  </div>
  <div class="tools filters">
    <label class="fl">${L("Susun","Sort")}<select id="susun">${susun.map(([v,l]) => opt(v, l, st.susun)).join("")}</select></label>
    <label class="fl">${L("Tahun","Year")}<select id="tahun">${opt("", all_, st.tahun)}${TAHUN.map(y => opt(y, y, st.tahun)).join("")}${opt("?", L("Tarikh tak pasti","Date uncertain"), st.tahun)}</select></label>
    <label class="fl">${L("Tema","Theme")}<select id="tema">${opt("", all_, st.tema)}${Object.entries(tema()).map(([k,v]) => opt(k, v, st.tema)).join("")}</select></label>
    <label class="fl">Status<select id="vv">${opt("", all_, st.v)}${["Salah","Tak disokong","Belum dapat disahkan","Sebahagian betul","Betul"].map(v => opt(v, vL(v), st.v)).join("")}${opt("-", L("Belum disemak","Not yet checked"), st.v)}</select></label>
    <label class="tog"><input type="checkbox" id="kl"${st.klip?" checked":""}> ${L("Ada klip","Has clip")}</label>
    <button class="reset" id="reset" type="button"${(st.q||st.tahun||st.tema||st.v||st.klip) ? "" : " hidden"}>${L("Set semula","Reset")}</button>
  </div>`;
}

function listHTML(){
  const hits = all.filter(match);
  let h = st.fatal
    ? `<p class="count">${hits.length} ${L("dakwaan (no. 13 merangkumi dua dakwaan)","claims (no. 13 covers two claims)")}</p>`
    : `<p class="count">${L(`${hits.length} daripada ${all.length} dakwaan`, `${hits.length} of ${all.length} claims`)}</p>`;
  if (!hits.length) return h + `<p class="empty">${L("Tiada dakwaan sepadan. Cuba kata carian lain atau buang penapis.","No matching claims. Try another search term or remove filters.")}</p>`;
  // Sumber bertarikh disusun ikut tarikh; yang tarikhnya tak pasti sentiasa di hujung
  const dated = A.sumber.filter(s => tahunOf(s) !== "?"), undated = A.sumber.filter(s => tahunOf(s) === "?");
  const order = (st.susun === "lama" ? dated : [...dated].reverse()).concat(undated);
  // Susunan ikut populariti: rata, tanpa kumpulan sumber
  if (st.susun === "popular" || st.susun === "sanggah"){
    const key = st.susun === "popular" ? skorPopular : skorSanggah;
    const sorted = hits.map(c => [key(c.d), c]).filter(([k]) => k > 0).sort((a, b) => b[0] - a[0]).map(([, c]) => c);
    const shown = sorted.slice(0, st.nTop || 100);
    return h.replace(/<p class="count">.*?<\/p>/, `<p class="count">${L(`${sorted.length} dakwaan, disusun ${st.susun === "popular" ? "ikut paling banyak diperkatakan (diulang dalam video, disanggah, diliput)" : "ikut paling banyak sanggahan"}`, `${sorted.length} claims, sorted by ${st.susun === "popular" ? "how widely discussed (repeated in videos, rebutted, covered)" : "number of rebuttals"}`)}</p>`)
      + `<ul class="rows">${shown.map(rowHTML).join("")}</ul>`
      + (sorted.length > shown.length ? `<div class="btns" style="justify-content:center;margin:16px 0"><button class="btn" id="moreTop" type="button">${L("Tunjuk 100 lagi","Show 100 more")}</button></div>` : "");
  }
  if (st.fatal){

  }

  const buka = !!(st.q || st.tema || st.v || st.tahun || st.klip) || hits.length <= 60;

  });
  return h;
}

    document.getElementById("tx").addEventListener("change", e => { tst.tx = e.target.checked; tst.n = 30; re(); });
    document.getElementById("ttlist").addEventListener("click", e => {
      const more = e.target.closest("#ttmore"); if (more){ tst.n += 30; re(); return; }
      const p = e.target.closest("[data-play]");
      if (p){ const slot = p.closest("li").querySelector(".tt-slot");
        if (slot.hidden){ slot.innerHTML = ART ? `<p class="empty">${L("Video tak boleh dimainkan dalam versi ini. Guna “Buka di TikTok”.","Videos cannot play in this version. Use “Open on TikTok”.")}</p>` : `<div class="ttvideo"><iframe title="${L("Video TikTok","TikTok video")}" src="https://www.tiktok.com/player/v1/${p.dataset.play}?description=1&rel=0" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`; slot.hidden = false; p.textContent = L("Tutup video","Close video"); }
        else { slot.hidden = true; slot.innerHTML = ""; p.textContent = "▶ " + L("Tonton","Watch"); } return; }
      const t = e.target.closest("[data-tx]");
      if (t){ const box = t.closest("li").querySelector(".tt-tx"); box.hidden = !box.hidden; t.textContent = box.hidden ? L("Transkrip","Transcript") : L("Tutup transkrip","Close transcript"); }
    });
  });
}
function viewSanggahan(focus){
  const count = id => SG.filter(x => x.oleh.includes(id)).length;
  const jemput = SG.filter(x => x.jenis === "jemputan");
  const card = o => {
    const xs = SG.filter(x => x.oleh.includes(o.id)).sort((a, b) => b.i - a.i);
    const cred = [
      [L("Jawatan","Position"), esc(oF(o, "jawatan"))],
      oF(o, "bidang") ? [L("Bidang","Field"), esc(oF(o, "bidang"))] : null,
      oF(o, "nota") ? [L("Catatan","Note"), esc(oF(o, "nota"))] : null,
      o.profil ? [L("Profil","Profile"), `<a href="${esc(o.profil)}" target="_blank" rel="noopener">${esc(o.profil.replace(/^https?:\/\/(www\.)?/, "").split("/")[0])} ↗</a>${o.sosial ? ` · <a href="${esc(o.sosial)}" target="_blank" rel="noopener">${/youtube/.test(o.sosial) ? "YouTube" : "Facebook"} ↗</a>` : ""}`]
               : (o.sosial ? [L("Profil","Profile"), `<a href="${esc(o.sosial)}" target="_blank" rel="noopener">${/youtube/.test(o.sosial) ? "YouTube" : "Facebook"} ↗</a>`] : null),
    ].filter(Boolean);
    return `<details class="pp" id="s-${o.id}"${focus === o.id ? " open" : ""}>
      <summary>${avatar(o)}<span style="min-width:0"><p class="pp-n">${esc(o.nama)}</p><p class="pp-j">${esc(oF(o, "jawatan"))}</p></span>
        <span class="pp-c"><b>${xs.length}</b>${L("sanggahan","items")} <span class="chev">▾</span></span></summary>
      <div class="pp-body"><dl class="pp-cred">${cred.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
        <ul class="sang">${xs.map(x => sgItemHTML(x, true)).join("")}</ul></div></details>`;
  };
  app.innerHTML = `<div class="wrap prose" style="padding-bottom:0;max-width:none"><div class="eyebrow" style="margin-top:28px">${L("Siapa menyanggah","Who has responded")}</div>
    <h1 style="font-size:clamp(32px,5vw,52px)">${L("Sanggahan","Rebuttals")}</h1>
    <p class="lede" style="max-width:64ch">${L("Sejarawan, ahli arkeologi, penulis dan pengulas yang telah menjawab dakwaan Solehah Yaacob. Klik nama untuk lihat jawatan, bidang kepakaran (disemak daripada profil rasmi universiti) dan senarai sanggahan mereka.",
      "Historians, archaeologists, writers and commentators who have responded to Solehah Yaacob's claims. Click a name to see their position, field of expertise (checked against official university profiles) and their rebuttals. Most rebuttals are in Malay.")}</p>
    ${jemput.length ? `<div class="callout"><h3>${L("Jemputan berdialog yang dihantar kepada Solehah","Invitations to debate sent to Solehah")}</h3><ul class="sang">${jemput.map(x => sgItemHTML(x, false)).join("")}</ul></div>` : ""}
  </div>
  <div class="wrap">${KAT.map(k => { const os = PY.orang.filter(o => o.kategori === k && count(o.id)); return os.length ? `<h2 class="sg-h">${esc(katL(k))}</h2><div class="ppl">${os.map(card).join("")}</div>` : ""; }).join("")}
    <p class="vnote" style="margin-top:18px">${L("Ada sanggahan lain oleh ahli akademik atau penulis? Hantar melalui butang “Hantar pembahasan” di halaman dakwaan berkenaan.","Know of another rebuttal by an academic or writer? Send it through the “Send a rebuttal” button on the relevant claim page.")}</p></div>`;
  bindSang();
  if (focus){ const el = document.getElementById("s-" + focus); if (el) setTimeout(() => el.scrollIntoView({block: "start"}), 50); }
  else window.scrollTo(0, 0);
}
function viewKronologi(){
  const K = EN() && A.kronologi_en ? A.kronologi_en : A.kronologi;
  app.innerHTML = `<div class="wrap prose"><div class="eyebrow" style="margin-top:28px">${L("Garis masa","Timeline")}</div><h1 style="font-size:clamp(32px,5vw,52px)">${L("Kronologi","Timeline")}</h1>
  <ol class="tl">${K.map(([d,e]) => `<li><b>${esc(d)}</b>${esc(e)}</li>`).join("")}</ol></div>`;
}
function viewTentang(){
  if (EN()){ app.innerHTML = `<div class="wrap prose"><div class="eyebrow" style="margin-top:28px">Method</div><h1 style="font-size:clamp(32px,5vw,52px)">About this archive</h1>
  <p>This archive collects Solehah Yaacob's <b>public</b> statements on history, religion and science, from lectures, podcasts, videos and social-media posts since 2018, along with news coverage. Every claim is tied to its original source so anyone can watch it and judge for themselves.</p>
  <h2>Language</h2>
  <p>The archive's primary language is Malay, the language in which the claims were made. The English version is translated by the archive. Each claim page shows the original Malay wording beneath the translation; for her exact words, watch the clip. Videos, transcripts and most rebuttals are in Malay.</p>
  <h2>Fact-check status</h2>
  <p>${pill("Salah")} contradicted by clear evidence · ${pill("Tak disokong")} no evidence found · ${pill("Belum dapat disahkan")} the cited source could not be accessed · ${pill("Sebahagian betul")} has some basis but is distorted · ${pill("Betul")} supported by evidence · ${pill("")} not yet checked.</p>
  <p>The short note on each claim is a summary, not a full study. If there is a mistake, send a rebuttal with sources and the status will be updated.</p>
  <h2>Transcripts</h2>
  <p>Most claims were transcribed by hand; some with automatic transcription (Whisper). Timestamps marked “approximate” were matched automatically and may be off by a few seconds to minutes.</p>
  <h2>Right of reply</h2>
  <p>Solehah Yaacob or her representatives may send an explanation or correction for any claim using the “Send a rebuttal” button. Explanations with sources will be shown alongside the claim.</p>
  <h2>Comment guidelines</h2>
  <p>Discuss the claims, not the person. Bring sources. Comments that insult, contain personal information or threats will be removed.</p>
  <h2>Copyright</h2>
  <p>Videos play through the official YouTube, Facebook and TikTok players from the original channels; no video is copied to this site. Quotations are made for the purpose of review and criticism.</p></div>`; return; }
  app.innerHTML = `<div class="wrap prose"><div class="eyebrow" style="margin-top:28px">Kaedah</div><h1 style="font-size:clamp(32px,5vw,52px)">Tentang arkib ini</h1>
  <p>Arkib ini mengumpul kenyataan <b>awam</b> Solehah Yaacob tentang sejarah, agama dan sains, daripada ceramah, podcast, video dan hantaran media sosial sejak 2018, berserta liputan berita. Setiap dakwaan diikat pada sumber asalnya supaya sesiapa pun boleh tonton dan nilai sendiri.</p>
  <h2>Status semakan</h2>
  <p>${pill("Salah")} bercanggah dengan bukti yang jelas · ${pill("Tak disokong")} tiada bukti ditemui · ${pill("Belum dapat disahkan")} sumber yang dirujuk belum dapat diakses · ${pill("Sebahagian betul")} ada asas tetapi diherotkan · ${pill("Betul")} disokong bukti · ${pill("")} belum disemak.</p>
  <p>Nota pendek pada setiap dakwaan ialah ringkasan, bukan kajian penuh. Jika ada kesilapan, hantar pembahasan dengan sumber — status akan dikemas kini.</p>
  <h2>Transkrip</h2>
  <p>Kebanyakan dakwaan ditranskrip secara manual; sebahagian lagi dengan transkripsi automatik (Whisper). Cap masa bertanda “anggaran” dipadankan secara automatik dan mungkin lari beberapa saat hingga minit.</p>
  <h2>Hak menjawab</h2>
  <p>Solehah Yaacob atau wakilnya boleh menghantar penjelasan atau pembetulan bagi mana-mana dakwaan melalui butang “Hantar pembahasan”. Penjelasan yang disertakan sumber akan dipaparkan di sebelah dakwaan berkenaan.</p>
  <h2>Garis panduan komen</h2>
  <p>Bincang dakwaan, bukan peribadi. Bawa sumber. Komen yang menghina, mengandungi maklumat peribadi atau ugutan akan dipadam.</p>
  <h2>Hak cipta</h2>
  <p>Video dimainkan melalui pemain rasmi YouTube, Facebook dan TikTok daripada saluran asal; tiada video disalin ke laman ini. Petikan dibuat untuk tujuan ulasan dan kritikan.</p>
  <h2>Bahasa</h2>
  <p>Bahasa utama arkib ini ialah Bahasa Melayu. Versi English (butang EN di atas) diterjemah oleh pihak arkib untuk pembaca antarabangsa; teks asal BM sentiasa dipaparkan di halaman setiap dakwaan.</p></div>`;
}

function route(){
  const h = location.hash.slice(1);
  const r = h.startsWith("d-") ? "detail" : h.startsWith("p-") ? "pdf" : h.startsWith("s-") ? "sanggahan" : (h || "home");
  document.querySelectorAll(".nav nav a").forEach(a => {
    if (a.dataset.r === r || (r === "detail" && a.dataset.r === "home") || (r === "pdf" && a.dataset.r === "penerbitan")) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (r === "detail") viewDetail(h.slice(2));
  else if (r === "pdf") viewPdf(h.slice(2));
  else if (r === "penerbitan") viewPenerbitan();
  else if (r === "tiktok") viewTikTok();
  else if (r === "sanggahan") viewSanggahan(h.startsWith("s-") ? h.slice(2) : "");
  else if (r === "fatal") viewHome(true);
  else if (r === "kronologi") viewKronologi();
  else if (r === "tentang") viewTentang();
  else viewHome(false);
  const nama = L("Arkib Dakwaan Solehah", "Solehah Claims Archive");
  document.title = r === "detail" && byId[h.slice(2)] ? `${h.slice(2)} · ${nama}` : nama;
}
window.addEventListener("hashchange", route);
chrome();
route();
})();
</script>
